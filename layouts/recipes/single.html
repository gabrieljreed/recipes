{{ define "main" }}
  <article class="mx-auto max-w-7xl px-4 pb-16 pt-10 sm:px-6 lg:px-8">
    <header class="mb-10">
      {{ with .Date }}
        <p class="text-sm text-slate-500 dark:text-slate-400">{{ .Format "January 2, 2006" }}</p>
      {{ end }}
      <h1 class="mt-2 text-4xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">{{ .Title }}</h1>
      {{ with .Params.tags }}
        <div class="mt-4 flex flex-wrap gap-2">
          {{ range $tag := . }}
            {{ $term := site.GetPage (printf "/tags/%s/" ($tag | urlize)) }}
            <a href="{{ with $term }}{{ .RelPermalink }}{{ else }}{{ printf "tags/%s/" ($tag | urlize) | relURL }}{{ end }}" class="inline-flex rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-sm text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">{{ $tag }}</a>
          {{ end }}
        </div>
      {{ end }}
    </header>

    <div class="prose prose-lg mx-auto max-w-full dark:prose-invert">
      {{ .Content }}
    </div>
  </article>
{{ end }}
